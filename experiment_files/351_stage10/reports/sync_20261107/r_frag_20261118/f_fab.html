2" fill="#8a8f98" text-anchor="start" font-family="'Noto Sans SC','PingFang SC','Droid Sans Fallback',system-ui,sans-serif">n = 4,578 target / 2,187 control papers · shares as fractions</text><text x="70.0" y="500.0" font-size="10.5" fill="#4B5363" font-family="'Noto Sans SC','PingFang SC','Droid Sans Fallback',system-ui,sans-serif"><tspan x="70.0" dy="0.0">怎么算：每个编造的名字（与真作者不匹配、按姓 + 名首字母）依次归类，先匹配先算：真作者的合作者 → 同领域的真实作者 → 队列中其他作者 → 不在数据中；占可分类名字的比例（合并比率）；机会基线 = 打乱编造名字后在同领域重算</tspan><tspan x="70.0" dy="13.2">（20 次）；全名 / 罕见姓为敏感性 · 8,872 篇、40,219 个名字 · 团队整群 2,000 次 · 391_groups/summary_fabricated_20261114/report.md</tspan></text><text x="70.0" y="530.4" font-size="9" fill="#7A808C" font-family="'Noto Sans SC','PingFang SC','Droid Sans Fallback',system-ui,sans-serif"><tspan x="70.0" dy="0.0">Plotted — co-author 4.0% [3.0, 5.2] (target 2.6%, control 5.3%; permuted same-field chance 1.3%) | same-field author 20.2% [19.4, 21.0] (target 18.0%, control 22.2%; permuted same-field chance 22.6%) | other cohort</tspan><tspan x="70.0" dy="11.0">author 25.4% [24.8, 26.0] (target 25.8%, control 25.2%; permuted same-field chance 25.7%) | not in the data 50.4% [49.0, 51.7] (target 53.7%, control 47.4%; permuted same-field chance 50.5%) | T − C co-author, surname</tspan><tspan x="70.0" dy="11.0">+ initial −0.027 [−0.039, −0.015] | T − C co-author, full name +0.000 [−0.000, +0.000] | T − C co-author, rare surname +0.000 [−0.001, +0.001] | T − C not in data, surname + initial +0.063 [+0.043, +0.082]</tspan></text><text font-weight="700" x="70.0" y="571.4" font-size="13.5" fill="#22304A" font-family="'Noto Sans SC','PingFang SC','Droid Sans Fallback',system-ui,sans-serif"><tspan x="70.0" dy="0.0">邻居混淆（C）不支持（探索性、事后）：编造的名字一半是数据里没有的人（50.4% [49.0, 51.7]），与同领域打乱基线 50.5% 相同；合作者占 4.0% [3.0, 5.2]，高于打乱基线</tspan><tspan x="70.0" dy="17.0">1.3%，但用全名或罕见姓匹配时，合作者的 target − control ≈ 0。</tspan></text><text x="70.0" y="609.4" font-size="13.5" fill="#22304A" font-family="'Noto Sans SC','PingFang SC','Droid Sans Fallback',system-ui,sans-serif"><tspan x="70.0" dy="0.0">前提：只用原 label package 的开放回答（贪心）；&quot;不在数据中&quot;只指不在 9,108 篇队列的作者表里，不等于现实中不存在；未预注册，只作描述。</tspan></text><text x="70" y="699" class="src" font-size="11" fill="#8a8f98" text-anchor="start"><tspan x="70" dy="0">391_groups/summary_fabricated_20261114/report.md (main table, target − control) · class_shares_by_group.csv · chance_baselines.csv · target_minus_control.csv · script</tspan><tspan x="70" dy="13">~/jlens_work/14_groups/fabricated_names_20261114.py</tspan></text>
