 first / last token rand 0.067 [0.055,</tspan><tspan x="70.0" dy="11.0">0.080] (n 600) | content words syn − rand −0.287 [−0.306, −0.269] (n 596) | rare words syn − rand −0.140 [−0.159, −0.120] (n 397) | function words syn − rand −0.036 [−0.046, −0.027] (n 580) | first / last token syn −</tspan><tspan x="70.0" dy="11.0">rand −0.046 [−0.058, −0.035] (n 544) | probe L8–L24 surname gold, content syn − rand: L8 −0.021; L12 −0.026; L16 −0.028; L20 −0.027; L24 −0.029</tspan></text><text font-weight="700" x="70.0" y="582.4" font-size="13.5" fill="#22304A" font-family="'Noto Sans SC','PingFang SC','Droid Sans Fallback',system-ui,sans-serif"><tspan x="70.0" dy="0.0">描述性：内容词换成随机 token 损失 +0.374 [+0.354, +0.394]（信号全部消失，S 变成 −0.046），换成同义词只损失 +0.087；Δ −0.287 [−0.306, −0.269]。罕见词、功能词</tspan><tspan x="70.0" dy="17.0">、首末 token 的损失都小得多。</tspan></text><text x="70.0" y="620.4" font-size="13.5" fill="#22304A" font-family="'Noto Sans SC','PingFang SC','Droid Sans Fallback',system-ui,sans-serif"><tspan x="70.0" dy="0.0">局限：WordNet 同义词很粗糙（不保证意思不变），这只是弱的&quot;保留意思&quot;检验；随机替换改动的 token 更多（内容词平均 12.8 vs 5.6 个 token），Δ 的一部分可能来自改动量；有</tspan><tspan x="70.0" dy="17.0">同义词的论文更少（罕见词 397 篇）；600 篇子样本，无锁定判据。</tspan></text><text x="70" y="699" class="src" font-size="11" fill="#8a8f98" text-anchor="start"><tspan x="70" dy="0">381_stage13/summary_a18b_item5/item5_report.md · item5_table.csv (readout final and probe_L8–L24; est, lo, hi, n_papers) · variant table a18b_config/item5_variants_v3.parquet ·</tspan><tspan x="70" dy="13">config/prereg_addendum18b.md</tspan></text>
