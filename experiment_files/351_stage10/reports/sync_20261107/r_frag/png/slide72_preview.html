<style>
:root{

}

:root[data-theme="dark"]{ --outer:#10141C; --chrome:#1B2230; --chrome-ink:#EEF1F5; --chrome-pen:#AAB4C5; color-scheme:dark }
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0; height:100%; background:var(--outer); overflow:hidden; font-family:var(--hand)}
.viewport{position:relative; width:100%; height:100%; overflow:hidden}
.stage{position:absolute; left:50%; top:50%; width:1280px; height:720px; transform:translate(-50%,-50%) scale(var(--s,1)); box-shadow:0 3px 18px rgba(0,0,0,.25); overflow:hidden}
.slide{position:absolute; inset:0; display:none; padding:46px 70px 56px}
.slide.on{display:block}

.dk{background-color:var(--bd); color:var(--chalk);
  background-image:linear-gradient(var(--bdgrid) 1px,transparent 1px),linear-gradient(90deg,var(--bdgrid) 1px,transparent 1px); background-size:32px 32px}
.lt{background-color:var(--pp); color:var(--ink);

.im{padding:0; background:#fff}

.sub{font-size:21px; opacity:.75; margin-bottom:18px}
p{margin:0}
.dk .a{color:var(--dA)} .dk .b{color:var(--dB)} .dk .g{color:var(--dG)} .dk .r{color:var(--dR)} .dk .m{color:var(--chalk2)}

.dk .tag{color:var(--dA)} .lt .tag{color:var(--lB)}

.pg{position:absolute; right:30px; bottom:18px; font-size:17px; opacity:.6}
.row{display:flex; gap:26px; align-items:flex-start}
.col{flex:1; min-width:0}
.t{font-size:23px; line-height:1.42}
.t li{margin-bottom:8px}
ul{margin:0; padding-left:1.05em}
.box{border:2.5px solid currentColor; border-radius:255px 16px 225px 16px/16px 225px 16px 255px; padding:14px 20px}
.box.dash{border-style:dashed}
.note{background:var(--note); color:var(--note-ink); padding:16px 20px; font-size:21px; line-height:1.4; box-shadow:2px 4px 10px rgba(0,0,0,.28); transform:rotate(1.2deg)}

.note .h{font-weight:700; font-size:22px; margin-bottom:6px; display:block}

.card img{display:block; width:100%; height:auto}
.card figcaption{font-size:15px; color:#555; padding:4px 2px 0}
.card::before{content:""; position:absolute; top:-11px; left:50%; width:110px; height:24px; margin-left:-55px; background:rgba(242,227,166,.85); transform:rotate(-2deg)}
.lt .card{box-shadow:2px 4px 10px rgba(0,0,0,.14)}
table.tb{border-collapse:collapse; font-size:20px; line-height:1.3}
.tb td,.tb th{padding:6px 14px 6px 0; text-align:left; vertical-align:top; border-bottom:1.5px dashed rgba(170,180,197,.45); font-weight:400}
.tb th{opacity:.7; font-size:18px; border-bottom:2px solid currentColor}
.big{font-family:var(--title); font-size:70px; line-height:1}
.hl{background:linear-gradient(100deg,transparent 1%,rgba(246,166,90,.38) 3%,rgba(246,166,90,.38) 96%,transparent 99%) no-repeat 0 88%/100% 55%}
.dk .hl{background:none;color:var(--dA);border-bottom:2.5px solid var(--dA);padding:0 2px}
.lt .hl{background-image:linear-gradient(100deg,transparent 1%,rgba(255,228,94,.75) 3%,rgba(255,228,94,.75) 96%,transparent 99%)}
.arrow{font-size:30px; opacity:.8}
.split{position:absolute; inset:0; display:flex}
.split>.half{flex:1; padding:46px 40px 56px; position:relative}
.split>.half.dk{padding-left:70px}
.split>.half.lt{padding-right:60px}
.legend span{display:inline-block; padding:2px 12px; margin-right:10px; border-radius:6px; font-size:18px}
.nav{position:absolute; left:0; right:0; bottom:0; display:flex; justify-content:center; align-items:center; gap:14px; padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px)); pointer-events:none}
.nav button,.nav .count{pointer-events:auto; font-family:var(--hand); font-size:17px; color:var(--chrome-ink); background:var(--chrome); border:2px solid var(--chrome-ink); border-radius:18px 6px 16px 6px/6px 16px 6px 18px; padding:5px 14px; cursor:pointer}
.nav .count{border-color:transparent; color:var(--chrome-pen)}
.nav button:focus-visible{outline:3px solid #F6A65A; outline-offset:2px}
.mf{padding:0;background:#FFFBFB}
.mf>svg{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.mf .pg{color:#22304A}
.src{font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;font-size:12.5px;line-height:1.25;font-weight:400;color:#8a8f98;opacity:1;letter-spacing:0;font-style:normal;white-space:normal}
.dk .src{color:#9aa3b2}
svg text.src{font-size:12.5px;fill:#8a8f98}
.cavd{position:absolute;left:70px;right:70px;font-family:var(--hand);font-size:17px;color:#B54708}
